<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-display: 'Playfair Display', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --surface-0: #faf9f7;
      --surface-1: #f4f2ed;
      --surface-2: #ffffff;
      --surface-3: #f0ede7;
      --text-primary: #1a1713;
      --text-secondary: #5a574f;
      --text-muted: #8a8179;
      --border: rgba(26, 23, 19, 0.08);
      --border-strong: rgba(26, 23, 19, 0.15);
      --accent-primary: #c4933c;
      --accent-secondary: #8b7355;
      --accent-light: #e8dcc8;
      --accent-lighter: #f5ede0;
      --text-danger: #a32d2d;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface-0: #0f0d0b;
        --surface-1: #1a1714;
        --surface-2: #24201b;
        --surface-3: #2e291f;
        --text-primary: #f5f2ed;
        --text-secondary: #c4beb3;
        --text-muted: #8a8179;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.15);
        --accent-primary: #d4a85c;
        --accent-secondary: #a89070;
        --accent-light: #6b5d47;
        --accent-lighter: #3d3527;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.4);
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--surface-0);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1rem 4rem;
      line-height: 1.6;
    }

    .quiz-wrap { 
      width: 100%; 
      max-width: 660px; 
    }

    header { 
      margin-bottom: 3.5rem;
      text-align: center;
    }
    
    header h1 { 
      font-family: var(--font-display);
      font-size: 48px; 
      font-weight: 600;
      margin-bottom: 0.8rem;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    
    header p { 
      font-size: 16px; 
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .survey-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .survey-btn {
      padding: 10px 20px;
      border: 1.5px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-family: var(--font-sans);
    }

    .survey-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .survey-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    .progress-bar { 
      height: 3px; 
      background: var(--border); 
      border-radius: 2px; 
      margin-bottom: 3rem;
      overflow: hidden;
    }
    
    .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 2px; 
      transition: width 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .question-num { 
      font-size: 12px; 
      color: var(--accent-primary);
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      margin-bottom: 1rem;
      font-weight: 600;
    }
    
    .question-text { 
      font-family: var(--font-display);
      font-size: 28px; 
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 2.5rem;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .options { 
      display: flex; 
      flex-direction: column; 
      gap: 14px;
    }
    
    .option-btn {
      padding: 18px 22px;
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      font-size: 16px;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
      line-height: 1.6;
      transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      font-family: var(--font-sans);
      font-weight: 400;
      position: relative;
      overflow: hidden;
    }
    
    .option-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--accent-light);
      transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: -1;
    }
    
    .option-btn:hover {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    
    .option-btn.selected {
      border-color: var(--accent-primary);
      background: var(--accent-lighter);
      box-shadow: inset 0 0 0 1px var(--accent-primary), var(--shadow-md);
      color: var(--text-primary);
    }

    .likert-scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 2rem;
    }

    .likert-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border-strong);
      background: var(--surface-2);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .likert-btn:hover {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .likert-btn.selected {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    .likert-labels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1rem;
    }

    .nav { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-top: 2.5rem;
      gap: 16px;
    }
    
    .btn { 
      padding: 12px 28px; 
      border-radius: 10px; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      font-family: var(--font-sans);
      transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      letter-spacing: 0.01em;
      border: none;
    }
    
    .btn-primary { 
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary:hover:not(:disabled) { 
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    
    .btn-primary:disabled { 
      opacity: 0.5; 
      cursor: default;
      transform: none;
    }
    
    .btn-ghost { 
      background: transparent; 
      border: 1.5px solid var(--border-strong); 
      color: var(--text-secondary);
    }
    
    .btn-ghost:hover { 
      background: var(--surface-1);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .result-box { 
      padding: 2.5rem; 
      background: var(--surface-2);
      border-radius: 16px; 
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
    }
    
    .result-label { 
      font-size: 12px; 
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      color: var(--accent-primary);
      margin-bottom: 0.8rem;
      font-weight: 600;
    }
    
    .result-title { 
      font-family: var(--font-display);
      font-size: 36px; 
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 1.2rem;
      letter-spacing: -0.01em;
    }
    
    .result-desc { 
      font-size: 16px; 
      color: var(--text-secondary); 
      line-height: 1.8; 
      margin-bottom: 2rem;
      font-weight: 300;
    }
    
    .result-axes { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 16px; 
      margin-bottom: 2rem;
    }
    
    .axis-card { 
      padding: 16px 18px; 
      background: var(--surface-3);
      border-radius: 12px; 
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .axis-card:hover {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }
    
    .axis-name { 
      font-size: 11px; 
      color: var(--accent-primary);
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .axis-bar { 
      height: 8px; 
      background: var(--border); 
      border-radius: 4px; 
      margin-bottom: 8px;
      overflow: hidden;
    }
    
    .axis-fill { 
      height: 100%; 
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      transition: width 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    
    .axis-labels { 
      display: flex; 
      justify-content: space-between; 
      font-size: 11px; 
      color: var(--text-muted);
      font-weight: 500;
    }

    .axis-score {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-primary);
      margin-top: 6px;
    }

    .comparison-section {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .comparison-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    .comparison-item {
      padding: 14px;
      background: var(--surface-3);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .comparison-label {
      font-size: 12px;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .comparison-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .comparison-values {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .comparison-your-score {
      font-weight: 600;
      color: var(--accent-primary);
    }

    .comparison-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
      position: relative;
    }

    .comparison-bar-user {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 3px;
      position: relative;
    }

    .loading { 
      text-align: center; 
      padding: 4rem 1rem;
    }
    
    .spinner { 
      width: 44px; 
      height: 44px; 
      border: 2.5px solid var(--border-strong); 
      border-top-color: var(--accent-primary); 
      border-radius: 50%; 
      animation: spin 1s cubic-bezier(0.4, 0.0, 0.6, 1) infinite; 
      margin: 0 auto 1.5rem;
    }
    
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }
    
    .loading-text { 
      font-size: 16px; 
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.02em;
    }
    
    .restart-btn { 
      width: 100%;
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 36px;
      }
      
      .question-text { 
        font-size: 24px;
      }
      
      .result-axes { 
        grid-template-columns: 1fr;
      }
      
      .result-box {
        padding: 2rem;
      }
      
      .btn {
        padding: 10px 20px;
        font-size: 13px;
      }

      .comparison-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .likert-scale {
        grid-template-columns: repeat(5, 1fr);
      }

      .survey-selector {
        flex-direction: column;
      }

      .survey-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-wrap">
    <header>
      <h1 id="header-title">Survey Suite</h1>
      <p id="header-desc">Choose a survey to explore</p>
    </header>

    <div id="survey-selector" class="survey-selector">
      <button class="survey-btn active" onclick="selectSurvey('political')">Political Philosophy</button>
      <button class="survey-btn" onclick="selectSurvey('big5')">Big 5 Personality</button>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div id="content"></div>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

    // Political Philosophy Quiz Data
    const politicalQuestions = [
      {
        q: "The government's primary role should be to...",
        options: ["Protect individual rights and freedoms with minimal interference", "Ensure equal opportunity and reduce systemic disadvantages", "Balance protecting rights with ensuring fairness"],
        axes: { liberty: [2, 0, 1], economic: [2, 0, 1], social: [0, 2, 1], change: [0, 2, 1] }
      },
      {
        q: "When it comes to the economy, I believe...",
        options: ["Free markets naturally lead to the best outcomes for everyone", "Markets need strong regulation to prevent exploitation", "We should blend market freedom with necessary safeguards"],
        axes: { liberty: [2, 0, 1], economic: [2, 0, 1], social: [0, 2, 1], change: [0, 1, 2] }
      },
      {
        q: "On immigration, the priority should be...",
        options: ["Open borders — people should be free to move where they choose", "A controlled system that balances compassion with national interests", "Strict limits to protect jobs and culture"],
        axes: { liberty: [2, 1, 0], economic: [1, 1, 0], social: [2, 1, 0], change: [2, 1, 0] }
      },
      {
        q: "Taxes should primarily be used to...",
        options: ["Be kept as low as possible so people keep their earnings", "Fund essential services like healthcare, education, and infrastructure", "Be moderate, funding key services without over-taxation"],
        axes: { liberty: [2, 0, 1], economic: [2, 0, 1], social: [0, 2, 1], change: [0, 2, 1] }
      },
      {
        q: "On social issues like marriage equality and drug policy, I think...",
        options: ["Individuals should have maximum personal freedom in lifestyle choices", "Society should protect marginalized groups while respecting tradition", "Government should stay neutral on personal lifestyle choices"],
        axes: { liberty: [2, 0, 1], economic: [1, 1, 1], social: [2, 0, 1], change: [2, 0, 1] }
      },
      {
        q: "Climate change policy should...",
        options: ["Be left to market innovation rather than government mandates", "Involve moderate regulations and international cooperation", "Be prioritized with strong government intervention"],
        axes: { liberty: [2, 1, 0], economic: [2, 1, 0], social: [1, 1, 2], change: [0, 1, 2] }
      },
      {
        q: "Criminal justice should focus on...",
        options: ["Protecting individual rights from state overreach", "Rehabilitation and addressing root causes of crime", "Swift punishment as a deterrent to crime"],
        axes: { liberty: [2, 1, 0], economic: [1, 1, 1], social: [0, 2, 0], change: [0, 2, 0] }
      },
      {
        q: "Healthcare should be...",
        options: ["A free market good where competition drives down costs", "A right, provided through a public-private mixed system", "Controlled primarily by government to ensure universal access"],
        axes: { liberty: [2, 1, 0], economic: [2, 1, 0], social: [0, 1, 2], change: [0, 1, 2] }
      },
      {
        q: "My view on political authority is...",
        options: ["The less government, the better — people can govern themselves", "Government is a necessary tool for creating a just society", "Strong leadership is needed to maintain order"],
        axes: { liberty: [2, 1, 0], economic: [2, 1, 0], social: [0, 2, 0], change: [0, 2, 0] }
      },
      {
        q: "When tradition and progress conflict, I think...",
        options: ["Both deserve equal scrutiny before acting", "Progress and reform should take priority over outdated norms", "Tradition contains wisdom and should guide us carefully"],
        axes: { liberty: [1, 2, 0], economic: [1, 2, 0], social: [1, 2, 0], change: [1, 2, 0] }
      },
      {
        q: "Gun ownership should be...",
        options: ["An absolute right with minimal restrictions", "Allowed with reasonable background checks and regulations", "Tightly regulated to protect public safety"],
        axes: { liberty: [2, 1, 0], economic: [1, 1, 1], social: [0, 1, 2], change: [0, 1, 2] }
      },
      {
        q: "The best way to address poverty is...",
        options: ["Remove barriers to entrepreneurship and economic freedom", "Expand social safety nets and job training programs", "Encourage community and mutual aid alongside targeted support"],
        axes: { liberty: [2, 0, 1], economic: [2, 0, 1], social: [0, 2, 1], change: [0, 2, 1] }
      },
      {
        q: "On foreign policy, I believe the country should...",
        options: ["Stay out of other nations' affairs and focus on itself", "Engage diplomatically and through multilateral institutions", "Protect national interests while respecting others' sovereignty"],
        axes: { liberty: [2, 1, 0], economic: [2, 1, 0], social: [0, 2, 1], change: [0, 1, 1] }
      },
      {
        q: "Public education should...",
        options: ["Be opened to competition through school choice and vouchers", "Be well-funded and equitable across all communities", "Emphasize civic values, discipline, and traditional curricula"],
        axes: { liberty: [2, 0, 1], economic: [2, 0, 1], social: [0, 2, 0], change: [0, 2, 0] }
      },
      {
        q: "When it comes to corporations and big business...",
        options: ["They drive innovation and should face minimal regulation", "They need oversight to prevent monopolies and protect workers", "They should serve the public good, not just profit"],
        axes: { liberty: [2, 0, 1], economic: [2, 0, 1], social: [0, 2, 1], change: [0, 2, 1] }
      },
      {
        q: "Drug policy should...",
        options: ["Fully decriminalize or legalize all drugs as a personal freedom", "Decriminalize personal use while targeting trafficking", "Maintain strict laws to prevent drug harm"],
        axes: { liberty: [2, 1, 0], economic: [1, 1, 1], social: [2, 1, 0], change: [2, 1, 0] }
      },
      {
        q: "The gap between rich and poor is...",
        options: ["A natural result of differing talent and effort", "A problem that requires government intervention to fix", "Concerning but best addressed through growth and opportunity"],
        axes: { liberty: [2, 0, 1], economic: [2, 0, 1], social: [0, 2, 1], change: [0, 2, 1] }
      },
      {
        q: "Free speech should be...",
        options: ["Absolute — the government should never restrict speech", "Protected but with limits on harassment and incitement", "Balanced with responsibility and protection of vulnerable groups"],
        axes: { liberty: [2, 1, 0], economic: [1, 1, 1], social: [0, 1, 2], change: [0, 1, 2] }
      },
      {
        q: "On religion and government, I believe...",
        options: ["The state should be fully secular and religion kept private", "Faith can inform values but shouldn't dictate law", "Religious and moral values should guide public policy"],
        axes: { liberty: [2, 1, 0], economic: [1, 1, 1], social: [0, 1, 2], change: [0, 1, 2] }
      },
      {
        q: "The best description of my overall political outlook is...",
        options: ["I want maximum freedom for individuals from all authority", "I want a fair, reformed system that works for everyone", "I value tradition, stability, and gradual progress"],
        axes: { liberty: [2, 1, 0], economic: [2, 1, 0], social: [0, 2, 0], change: [0, 2, 0] }
      }
    ];

    // Big 5 Personality Test Data
    const big5Questions = [
      { q: "I am the life of the party.", traits: { extroversion: 1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I feel little concern for others.", traits: { extroversion: 0, agreeableness: -1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I am always prepared.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 1, neuroticism: 0, openness: 0 } },
      { q: "I get stressed out easily.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 1, openness: 0 } },
      { q: "I have a rich vocabulary.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 1 } },
      { q: "I don't talk a lot.", traits: { extroversion: -1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I am interested in people.", traits: { extroversion: 0, agreeableness: 1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I leave my belongings around.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: -1, neuroticism: 0, openness: 0 } },
      { q: "I am relaxed most of the time.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: -1, openness: 0 } },
      { q: "I have difficulty understanding abstract ideas.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: -1 } },
      { q: "I feel comfortable around people.", traits: { extroversion: 1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I insult people.", traits: { extroversion: 0, agreeableness: -1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I pay attention to details.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 1, neuroticism: 0, openness: 0 } },
      { q: "I worry about things.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 1, openness: 0 } },
      { q: "I have a vivid imagination.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 1 } },
      { q: "I keep in the background.", traits: { extroversion: -1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I sympathize with others' feelings.", traits: { extroversion: 0, agreeableness: 1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I make a mess of things.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: -1, neuroticism: 0, openness: 0 } },
      { q: "I seldom feel blue.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: -1, openness: 0 } },
      { q: "I am not interested in abstract ideas.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: -1 } },
      { q: "I start conversations.", traits: { extroversion: 1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },

      { q: "I have excellent ideas.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 1 } },

      { q: "I often forget to put things back in their proper place.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: -1, neuroticism: 0, openness: 0 } },
      { q: "I get upset easily.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 1, openness: 0 } },
      { q: "I do not have a good imagination.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: -1 } },
      { q: "I talk to a lot of different people at parties.", traits: { extroversion: 1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I am not really interested in others.", traits: { extroversion: 0, agreeableness: -1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I like order.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 1, neuroticism: 0, openness: 0 } },
      { q: "I change my mood a lot.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 1, openness: 0 } },
      { q: "I am quick to understand things.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 1 } },
      { q: "I don't like to draw attention to myself.", traits: { extroversion: -1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I take time out for others.", traits: { extroversion: 0, agreeableness: 1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I shirk my duties.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: -1, neuroticism: 0, openness: 0 } },
      { q: "I have frequent mood swings.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 1, openness: 0 } },
      { q: "I use difficult words.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 1 } },
      { q: "I don't mind being the center of attention.", traits: { extroversion: 1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I feel others' emotions.", traits: { extroversion: 0, agreeableness: 1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I follow a schedule.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 1, neuroticism: 0, openness: 0 } },
      { q: "I get irritated easily.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 1, openness: 0 } },
      { q: "I spend time reflecting on things.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 1 } },
      { q: "I am quiet around strangers.", traits: { extroversion: -1, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I make people feel at ease.", traits: { extroversion: 0, agreeableness: 1, conscientiousness: 0, neuroticism: 0, openness: 0 } },
      { q: "I am exacting in my work.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 1, neuroticism: 0, openness: 0 } },
      { q: "I often feel blue.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 1, openness: 0 } },
      { q: "I am full of ideas.", traits: { extroversion: 0, agreeableness: 0, conscientiousness: 0, neuroticism: 0, openness: 1 } }
    ];

    let currentSurvey = 'political';
    let answers = [];
    let current = 0;

    function selectSurvey(survey) {
      currentSurvey = survey;
      answers = [];
      current = 0;
      
      document.querySelectorAll('.survey-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      if (survey === 'political') {
        document.getElementById('header-title').textContent = 'Political Philosophy Quiz';
        document.getElementById('header-desc').textContent = 'Discover your worldview through 20 thoughtful questions';
      } else {
        document.getElementById('header-title').textContent = 'Big 5 Personality Test';
        document.getElementById('header-desc').textContent = 'Understand your personality across 5 dimensions in 50 questions';
      }
      
      render();
    }

    function render() {
      const questions = currentSurvey === 'political' ? politicalQuestions : big5Questions;
      if (current < questions.length) renderQuestion();
      else renderLoading();
    }

    function renderQuestion() {
      const questions = currentSurvey === 'political' ? politicalQuestions : big5Questions;
      document.getElementById('progress').style.width = (current / questions.length * 100) + '%';
      const q = questions[current];
      
      let optionsHTML;
      if (currentSurvey === 'political') {
        optionsHTML = `
          <div class="options">
            ${q.options.map((o, i) => `<button class="option-btn${answers[current]===i?' selected':''}" onclick="select(${i})">${o}</button>`).join('')}
          </div>`;
      } else {
        optionsHTML = `
          <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 1.5rem;">I... ${q.q}</p>
          <div class="likert-labels">
            <span>Disagree</span>
            <span>Slightly<br>Disagree</span>
            <span>Neutral</span>
            <span>Slightly<br>Agree</span>
            <span>Agree</span>
          </div>
          <div class="likert-scale">
            ${[1, 2, 3, 4, 5].map(i => `<button class="likert-btn${answers[current]===i-1?' selected':''}" onclick="select(${i-1})">${i}</button>`).join('')}
          </div>`;
      }

      document.getElementById('content').innerHTML = `
        <p class="question-num">Question ${current + 1} of ${questions.length}</p>
        <p class="question-text">${currentSurvey === 'political' ? q.q : 'I...'}</p>
        ${currentSurvey === 'political' ? optionsHTML : `
          <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 1.5rem;">${q.q}</p>
          <div class="likert-labels">
            <span>Disagree</span>
            <span>Slightly<br>Disagree</span>
            <span>Neutral</span>
            <span>Slightly<br>Agree</span>
            <span>Agree</span>
          </div>
          <div class="likert-scale">
            ${[1, 2, 3, 4, 5].map(i => `<button class="likert-btn${answers[current]===i-1?' selected':''}" onclick="select(${i-1})">${i}</button>`).join('')}
          </div>
        `}
        <div class="nav">
          ${current > 0 ? `<button class="btn btn-ghost" onclick="back()">← Back</button>` : `<span></span>`}
          <button class="btn btn-primary" onclick="next()" ${answers[current]==null?'disabled':''}>
            ${current === questions.length - 1 ? 'See Results' : 'Next →'}
          </button>
        </div>`;
    }

    function select(i) { answers[current] = i; renderQuestion(); }
    function back() { current--; renderQuestion(); }
    function next() { if (answers[current] == null) return; current++; render(); }

    function renderLoading() {
      document.getElementById('progress').style.width = '100%';
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p class="loading-text">Calculating your results...</p>
        </div>`;
      setTimeout(analyzeAnswers, 800);
    }

    function analyzeAnswers() {
      if (currentSurvey === 'political') {
        analyzePolitical();
      } else {
        analyzeBig5();
      }
    }

    function analyzePolitical() {
      const scores = { liberty: 0, economic: 0, social: 0, change: 0 };
      
      politicalQuestions.forEach((q, i) => {
        const answerIdx = answers[i];
        Object.keys(scores).forEach(axis => {
          if (q.axes && q.axes[axis] !== undefined) {
            scores[axis] += q.axes[axis][answerIdx] || 0;
          }
        });
      });

      const maxScore = Math.max(...Object.values(scores));
      const normalizedScores = {};
      Object.keys(scores).forEach(axis => {
        normalizedScores[axis] = Math.round((scores[axis] / maxScore) * 100);
      });

      const result = classifyPhilosophy(normalizedScores);
      renderPoliticalResult({ ...result, ...normalizedScores });
    }

    function classifyPhilosophy(scores) {
      const { liberty, economic, social, change } = scores;
      
      if (liberty > 70) {
        if (economic > 60) {
          return {
            label: "Classical Liberal",
            description: "You believe in individual freedom and limited government, with emphasis on free markets and personal liberty as the foundation for human flourishing."
          };
        } else if (economic < 40) {
          return {
            label: "Libertarian Socialist",
            description: "You prioritize individual freedom alongside economic equality, seeking to minimize hierarchies in both government and markets."
          };
        } else {
          return {
            label: "Centrist Liberal",
            description: "You balance individual liberty with moderate government intervention, believing freedom works best within certain structural guardrails."
          };
        }
      } else if (liberty < 40) {
        if (social > 60 && change > 60) {
          return {
            label: "Progressive",
            description: "You believe in active government reform to address inequality and injustice, prioritizing collective wellbeing and social progress."
          };
        } else if (social < 40 && change < 40) {
          return {
            label: "Conservative",
            description: "You value tradition, stability, and gradual change, believing established institutions and moral values provide important guidance."
          };
        } else {
          return {
            label: "Communitarian",
            description: "You emphasize community and collective responsibility, seeking balance between individual needs and the common good."
          };
        }
      } else {
        if (change > 60) {
          return {
            label: "Social Democrat",
            description: "You support both individual rights and active government ensuring fairness and opportunity, with emphasis on democratic participation and reform."
          };
        } else {
          return {
            label: "Moderate",
            description: "You believe in pragmatic balance between competing values, seeking sensible middle-ground solutions that respect multiple perspectives."
          };
        }
      }
    }

    function analyzeBig5() {
      const scores = {
        extroversion: 0,
        agreeableness: 0,
        conscientiousness: 0,
        neuroticism: 0,
        openness: 0
      };

      // Map Likert responses (0-4) to agreement scale for scoring
      // 0 = Disagree, 1 = Slightly disagree, 2 = Neutral, 3 = Slightly agree, 4 = Agree
      const likertMap = [1, 2, 3, 4, 5];

      big5Questions.forEach((q, i) => {
        const response = likertMap[answers[i]];
        Object.keys(scores).forEach(trait => {
          if (q.traits[trait] !== 0) {
            if (q.traits[trait] === 1) {
              scores[trait] += response;
            } else if (q.traits[trait] === -1) {
              scores[trait] += (6 - response);
            }
          }
        });
      });

      // Calculate percentages (0-40 scale, convert to 0-100)
      const percentages = {};
      Object.keys(scores).forEach(trait => {
        percentages[trait] = Math.round((scores[trait] / 40) * 100);
      });

      renderBig5Result({ scores, percentages });
    }

    function renderBig5Result(data) {
      const { scores, percentages } = data;

      const traitDescriptions = {
        extroversion: "How outgoing, sociable, and energetic you are",
        agreeableness: "How compassionate, cooperative, and considerate you are",
        conscientiousness: "How organized, disciplined, and reliable you are",
        neuroticism: "How prone to stress, anxiety, and negative emotions you are",
        openness: "How curious, imaginative, and open to new experiences you are"
      };

      const traitInterpretations = {
        extroversion: {
          high: "You are very outgoing and energetic, enjoying social interaction and being the center of attention.",
          low: "You prefer intimate gatherings and solitude, finding large social events draining."
        },
        agreeableness: {
          high: "You are compassionate and cooperative, prioritizing harmony and helping others.",
          low: "You are independent and direct, valuing honesty even when it might hurt feelings."
        },
        conscientiousness: {
          high: "You are organized and disciplined, taking pride in your work and planning ahead.",
          low: "You are flexible and spontaneous, preferring to go with the flow."
        },
        neuroticism: {
          high: "You experience frequent mood changes and stress easily, feeling emotions intensely.",
          low: "You are emotionally stable and remain calm under pressure."
        },
        openness: {
          high: "You are imaginative and curious, enjoying new experiences and abstract thinking.",
          low: "You prefer familiar routines and practical, concrete thinking."
        }
      };

      const axisData = [
        { name: 'Extroversion', desc: traitDescriptions.extroversion, val: percentages.extroversion, score: scores.extroversion },
        { name: 'Agreeableness', desc: traitDescriptions.agreeableness, val: percentages.agreeableness, score: scores.agreeableness },
        { name: 'Conscientiousness', desc: traitDescriptions.conscientiousness, val: percentages.conscientiousness, score: scores.conscientiousness },
        { name: 'Neuroticism', desc: traitDescriptions.neuroticism, val: percentages.neuroticism, score: scores.neuroticism },
        { name: 'Openness', desc: traitDescriptions.openness, val: percentages.openness, score: scores.openness }
      ];

      document.getElementById('progress').style.width = '100%';
      
      // Save result and fetch comparison data
      saveBig5Result(scores);
      
      document.getElementById('content').innerHTML = `
        <div class="result-box">
          <p class="result-label">Your Big 5 Profile</p>
          <p class="result-title">Personality Analysis</p>
          <p class="result-desc">Your personality across the five major dimensions, based on 50 comprehensive questions.</p>
          <div style="display: grid; gap: 1.5rem;">
            ${axisData.map(a => `
              <div class="axis-card">
                <p class="axis-name">${a.name}</p>
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem;">${a.desc}</p>
                <div class="axis-bar"><div class="axis-fill" style="width:${a.val}%;"></div></div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                  <div class="axis-labels" style="flex: 1; font-size: 10px;">
                    <span>Low</span>
                    <span>High</span>
                  </div>
                  <div class="axis-score">${a.score}/40</div>
                </div>
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 0.8rem; font-style: italic;">
                  ${a.val > 60 ? traitInterpretations[a.name.toLowerCase()].high : a.val < 40 ? traitInterpretations[a.name.toLowerCase()].low : 'You score in the middle range, showing balance in this trait.'}
                </p>
              </div>
            `).join('')}
          </div>
          <div id="big5-comparison"></div>
          <button class="btn btn-ghost restart-btn" onclick="restart()">Retake Test</button>
        </div>`;
      
      // Fetch and display comparison data
      fetchBig5Comparison(percentages);
    }

    async function saveBig5Result(scores) {
      try {
        await fetch(`${API_BASE}/api/results`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            surveyType: 'big5',
            extroversion: scores.extroversion,
            agreeableness: scores.agreeableness,
            conscientiousness: scores.conscientiousness,
            neuroticism: scores.neuroticism,
            openness: scores.openness
          })
        });
      } catch (error) {
        console.log('Could not save Big 5 results to backend');
      }
    }

    async function fetchBig5Comparison(userScores) {
      try {
        const statsResponse = await fetch(`${API_BASE}/api/big5/stats`);
        
        if (!statsResponse.ok) {
          return;
        }

        const stats = await statsResponse.json();
        
        if (stats.total_responses === 0) {
          return;
        }

        const comparisonHTML = `
          <div class="comparison-section">
            <p class="comparison-title">How You Compare</p>
            <div class="comparison-item">
              <p class="comparison-label">Total Responses</p>
              <p style="font-size: 18px; font-weight: 600; color: var(--accent-primary);">${stats.total_responses}</p>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Extroversion</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_extroversion)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${userScores.extroversion}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${userScores.extroversion}%;"></div>
              </div>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Agreeableness</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_agreeableness)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${userScores.agreeableness}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${userScores.agreeableness}%;"></div>
              </div>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Conscientiousness</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_conscientiousness)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${userScores.conscientiousness}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${userScores.conscientiousness}%;"></div>
              </div>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Neuroticism</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_neuroticism)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${userScores.neuroticism}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${userScores.neuroticism}%;"></div>
              </div>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Openness</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_openness)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${userScores.openness}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${userScores.openness}%;"></div>
              </div>
            </div>
          </div>
        `;
        
        document.getElementById('big5-comparison').innerHTML = comparisonHTML;
      } catch (error) {
        console.log('Backend not available - Big 5 comparison data will not be shown');
      }
    }

    async function fetchComparison(scores) {
      try {
        const statsResponse = await fetch(`${API_BASE}/api/stats`);
        
        if (!statsResponse.ok) {
          return null;
        }

        const stats = await statsResponse.json();
        return stats;
      } catch (error) {
        console.log('Backend not available - comparison data will not be shown');
        return null;
      }
    }

    async function savePoliticalResult(result) {
      try {
        await fetch(`${API_BASE}/api/results`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            surveyType: 'political',
            label: result.label,
            liberty: result.liberty,
            economic: result.economic,
            social: result.social,
            change: result.change
          })
        });
      } catch (error) {
        console.log('Could not save political results to backend');
      }
    }

    async function renderPoliticalResult(r) {
      const axisData = [
        { name: 'Liberty', left: 'Authoritarian', right: 'Libertarian', val: r.liberty, color: '#c4933c' },
        { name: 'Economy', left: 'Socialist', right: 'Capitalist', val: r.economic, color: '#8b7355' },
        { name: 'Social', left: 'Conservative', right: 'Progressive', val: r.social, color: '#a89070' },
        { name: 'Change', left: 'Status Quo', right: 'Reform', val: r.change, color: '#d4a85c' }
      ];

      // Save result to backend
      await savePoliticalResult(r);

      // Fetch comparison data
      const stats = await fetchComparison(r);

      document.getElementById('progress').style.width = '100%';
      
      let comparisonHTML = '';
      if (stats && stats.total_responses > 0) {
        comparisonHTML = `
          <div class="comparison-section">
            <p class="comparison-title">How You Compare</p>
            <div class="comparison-item">
              <p class="comparison-label">Total Responses</p>
              <p style="font-size: 18px; font-weight: 600; color: var(--accent-primary);">${stats.total_responses}</p>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Liberty Axis</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_liberty)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${r.liberty}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${r.liberty}%;"></div>
              </div>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Economy Axis</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_economic)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${r.economic}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${r.economic}%;"></div>
              </div>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Social Axis</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_social)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${r.social}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${r.social}%;"></div>
              </div>
            </div>
            <div class="comparison-item">
              <p class="comparison-label">Change Axis</p>
              <div class="comparison-content">
                <span class="comparison-values">Community Avg: <strong>${Math.round(stats.avg_change)}</strong>%</span>
                <span class="comparison-values">Your Score: <span class="comparison-your-score">${r.change}%</span></span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-bar-user" style="width: ${r.change}%;"></div>
              </div>
            </div>
          </div>
        `;
      }

      document.getElementById('content').innerHTML = `
        <div class="result-box">
          <p class="result-label">Your Political Philosophy</p>
          <p class="result-title">${r.label}</p>
          <p class="result-desc">${r.description}</p>
          <div class="result-axes">
            ${axisData.map(a => `
              <div class="axis-card">
                <p class="axis-name">${a.name}</p>
                <div class="axis-bar"><div class="axis-fill" style="width:${a.val}%;background:${a.color}"></div></div>
                <div class="axis-labels"><span>${a.left}</span><span>${a.right}</span></div>
              </div>`).join('')}
          </div>
          ${comparisonHTML}
          <button class="btn btn-ghost restart-btn" onclick="restart()">Retake Quiz</button>
        </div>`;
    }

    function restart() { answers = []; current = 0; document.getElementById('progress').style.width = '0%'; render(); }

    render();
  </script>
