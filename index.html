<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Political Philosophy Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-display: 'Playfair Display', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --surface-0: #faf9f7;
      --surface-1: #f4f2ed;
      --surface-2: #ffffff;
      --surface-3: #f0ede7;
      --text-primary: #1a1713;
      --text-secondary: #5a574f;
      --text-muted: #8a8179;
      --border: rgba(26, 23, 19, 0.08);
      --border-strong: rgba(26, 23, 19, 0.15);
      --accent-primary: #c4933c;
      --accent-secondary: #8b7355;
      --accent-light: #e8dcc8;
      --accent-lighter: #f5ede0;
      --text-danger: #a32d2d;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface-0: #0f0d0b;
        --surface-1: #1a1714;
        --surface-2: #24201b;
        --surface-3: #2e291f;
        --text-primary: #f5f2ed;
        --text-secondary: #c4beb3;
        --text-muted: #8a8179;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.15);
        --accent-primary: #d4a85c;
        --accent-secondary: #a89070;
        --accent-light: #6b5d47;
        --accent-lighter: #3d3527;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.4);
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--surface-0);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1rem 4rem;
      line-height: 1.6;
    }

    .quiz-wrap { 
      width: 100%; 
      max-width: 660px; 
    }

    header { 
      margin-bottom: 3.5rem;
      text-align: center;
    }
    
    header h1 { 
      font-family: var(--font-display);
      font-size: 48px; 
      font-weight: 600;
      margin-bottom: 0.8rem;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    
    header p { 
      font-size: 16px; 
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .progress-bar { 
      height: 3px; 
      background: var(--border); 
      border-radius: 2px; 
      margin-bottom: 3rem;
      overflow: hidden;
    }
    
    .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 2px; 
      transition: width 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .question-num { 
      font-size: 12px; 
      color: var(--accent-primary);
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      margin-bottom: 1rem;
      font-weight: 600;
    }
    
    .question-text { 
      font-family: var(--font-display);
      font-size: 28px; 
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 2.5rem;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .options { 
      display: flex; 
      flex-direction: column; 
      gap: 14px;
    }
    
    .option-btn {
      padding: 18px 22px;
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      font-size: 16px;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
      line-height: 1.6;
      transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      font-family: var(--font-sans);
      font-weight: 400;
      position: relative;
      overflow: hidden;
    }
    
    .option-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--accent-light);
      transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: -1;
    }
    
    .option-btn:hover {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    
    .option-btn.selected {
      border-color: var(--accent-primary);
      background: var(--accent-lighter);
      box-shadow: inset 0 0 0 1px var(--accent-primary), var(--shadow-md);
      color: var(--text-primary);
    }

    .nav { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-top: 2.5rem;
      gap: 16px;
    }
    
    .btn { 
      padding: 12px 28px; 
      border-radius: 10px; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      font-family: var(--font-sans);
      transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      letter-spacing: 0.01em;
      border: none;
    }
    
    .btn-primary { 
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary:hover:not(:disabled) { 
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    
    .btn-primary:disabled { 
      opacity: 0.5; 
      cursor: default;
      transform: none;
    }
    
    .btn-ghost { 
      background: transparent; 
      border: 1.5px solid var(--border-strong); 
      color: var(--text-secondary);
    }
    
    .btn-ghost:hover { 
      background: var(--surface-1);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .result-box { 
      padding: 2.5rem; 
      background: var(--surface-2);
      border-radius: 16px; 
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
    }
    
    .result-label { 
      font-size: 12px; 
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      color: var(--accent-primary);
      margin-bottom: 0.8rem;
      font-weight: 600;
    }
    
    .result-title { 
      font-family: var(--font-display);
      font-size: 36px; 
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 1.2rem;
      letter-spacing: -0.01em;
    }
    
    .result-desc { 
      font-size: 16px; 
      color: var(--text-secondary); 
      line-height: 1.8; 
      margin-bottom: 2rem;
      font-weight: 300;
    }
    
    .result-axes { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 16px; 
      margin-bottom: 2rem;
    }
    
    .axis-card { 
      padding: 16px 18px; 
      background: var(--surface-3);
      border-radius: 12px; 
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .axis-card:hover {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }
    
    .axis-name { 
      font-size: 11px; 
      color: var(--accent-primary);
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .axis-bar { 
      height: 8px; 
      background: var(--border); 
      border-radius: 4px; 
      margin-bottom: 8px;
      overflow: hidden;
    }
    
    .axis-fill { 
      height: 100%; 
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      transition: width 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    
    .axis-labels { 
      display: flex; 
      justify-content: space-between; 
      font-size: 11px; 
      color: var(--text-muted);
      font-weight: 500;
    }

    .loading { 
      text-align: center; 
      padding: 4rem 1rem;
    }
    
    .spinner { 
      width: 44px; 
      height: 44px; 
      border: 2.5px solid var(--border-strong); 
      border-top-color: var(--accent-primary); 
      border-radius: 50%; 
      animation: spin 1s cubic-bezier(0.4, 0.0, 0.6, 1) infinite; 
      margin: 0 auto 1.5rem;
    }
    
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }
    
    .loading-text { 
      font-size: 16px; 
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.02em;
    }
    
    .restart-btn { 
      width: 100%;
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 36px;
      }
      
      .question-text { 
        font-size: 24px;
      }
      
      .result-axes { 
        grid-template-columns: 1fr;
      }
      
      .result-box {
        padding: 2rem;
      }
      
      .btn {
        padding: 10px 20px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-wrap">
    <header>
      <h1>Political Philosophy Quiz</h1>
      <p>Discover your worldview through 20 thoughtful questions</p>
    </header>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div id="content"></div>
  </div>

  <script>
    const questions = [
      { q: "The government's primary role should be to...", options: ["Protect individual rights and freedoms with minimal interference", "Ensure equal opportunity and reduce systemic disadvantages", "Enforce traditional moral values and social order"], axes: { liberty: 1, economic: 0, social: 0, change: 0 } },
      { q: "When it comes to the economy, I believe...", options: ["Free markets naturally lead to the best outcomes for everyone", "Markets need strong regulation to prevent exploitation", "We should prioritize community and collective wellbeing over individual profit"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "On immigration, the priority should be...", options: ["Open borders — people should be free to move where they choose", "A controlled system that balances compassion with national interests", "Strict limits to protect national identity and security"], axes: { liberty: 2, economic: 0, social: 0, change: 1 } },
      { q: "Taxes should primarily be used to...", options: ["Be kept as low as possible so people keep their earnings", "Fund essential services like healthcare, education, and infrastructure", "Redistribute wealth to ensure greater equality"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "On social issues like marriage equality and drug policy, I think...", options: ["Individuals should have maximum personal freedom in lifestyle choices", "Society should protect marginalized groups while allowing personal freedom", "Traditional values and morality should guide social policy"], axes: { liberty: 2, economic: 0, social: 2, change: 0 } },
      { q: "Climate change policy should...", options: ["Be left to market innovation rather than government mandates", "Involve moderate regulations and international cooperation", "Be prioritized with aggressive government action"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "Criminal justice should focus on...", options: ["Protecting individual rights from state overreach", "Rehabilitation and addressing root causes of crime", "Swift punishment as a deterrent to crime"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "Healthcare should be...", options: ["A free market good where competition drives down costs", "A right, provided through a public-private mixed system", "Controlled primarily by government to ensure universal access"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "My view on political authority is...", options: ["The less government, the better — people can govern themselves", "Government is a necessary tool for creating a just society", "Strong leadership is needed to maintain order and tradition"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "When tradition and progress conflict, I think...", options: ["Both deserve equal scrutiny before acting", "Progress and reform should take priority over outdated norms", "Tradition contains wisdom that shouldn't be discarded"], axes: { liberty: 0, economic: 0, social: 0, change: 0 } },
      { q: "Gun ownership should be...", options: ["An absolute right with minimal restrictions", "Allowed with reasonable background checks and regulations", "Tightly regulated to protect public safety"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "The best way to address poverty is...", options: ["Remove barriers to entrepreneurship and economic freedom", "Expand social safety nets and job training programs", "Encourage community and collective responsibility"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "On foreign policy, I believe the country should...", options: ["Stay out of other nations' affairs and focus on itself", "Engage diplomatically and through multilateral institutions", "Assertively promote its values and interests globally"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "Public education should...", options: ["Be opened to competition through school choice and vouchers", "Be well-funded and equitable across all communities", "Emphasize civic values, discipline, and traditional knowledge"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "When it comes to corporations and big business...", options: ["They drive innovation and should face minimal regulation", "They need oversight to prevent monopolies and protect workers", "They should serve community interests first"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "Drug policy should...", options: ["Fully decriminalize or legalize all drugs as a personal freedom", "Decriminalize personal use while targeting trafficking", "Maintain strict laws to prevent drug use"], axes: { liberty: 2, economic: 0, social: 2, change: 0 } },
      { q: "The gap between rich and poor is..., options: ["A natural result of differing talent and effort", "A problem that requires government intervention to fix", "Concerning but best addressed through community action"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "Free speech should be...", options: ["Absolute — the government should never restrict speech", "Protected but with limits on harassment and incitement", "Balanced with responsibility and protection from harm"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } },
      { q: "On religion and government, I believe...", options: ["The state should be fully secular and religion kept private", "Faith can inform values but shouldn't dictate law", "Religious and moral values should guide governance"], axes: { liberty: 0, economic: 0, social: 0, change: 0 } },
      { q: "The best description of my overall political outlook is...", options: ["I want maximum freedom for individuals from all authority", "I want a fair, reformed system that works for everyone", "I want to preserve values and stability while adapting carefully"], axes: { liberty: 2, economic: 0, social: 0, change: 0 } }
    ];

    let answers = [];
    let current = 0;

    function render() {
      if (current < questions.length) renderQuestion();
      else renderLoading();
    }

    function renderQuestion() {
      document.getElementById('progress').style.width = (current / questions.length * 100) + '%';
      const q = questions[current];
      document.getElementById('content').innerHTML = `
        <p class="question-num">Question ${current + 1} of ${questions.length}</p>
        <p class="question-text">${q.q}</p>
        <div class="options">
          ${q.options.map((o, i) => `<button class="option-btn${answers[current]===i?' selected':''}" onclick="select(${i})">${o}</button>`).join('')}
        </div>
        <div class="nav">
          ${current > 0 ? `<button class="btn btn-ghost" onclick="back()">← Back</button>` : `<span></span>`}
          <button class="btn btn-primary" onclick="next()" ${answers[current]==null?'disabled':''}>
            ${current === questions.length - 1 ? 'See Results' : 'Next →'}
          </button>
        </div>`;
    }

    function select(i) { answers[current] = i; renderQuestion(); }
    function back() { current--; renderQuestion(); }
    function next() { if (answers[current] == null) return; current++; render(); }

    function renderLoading() {
      document.getElementById('progress').style.width = '100%';
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p class="loading-text">Calculating your results...</p>
        </div>`;
      setTimeout(analyzeAnswers, 800);
    }

    function analyzeAnswers() {
      const scores = { liberty: 0, economic: 0, social: 0, change: 0 };
      
      questions.forEach((q, i) => {
        const answerIdx = answers[i];
        Object.keys(scores).forEach(axis => {
          const axisScores = [0, 0, 0];
          if (q.axes && q.axes[axis] !== undefined) {
            axisScores[q.axes[axis]] += 1;
          }
          scores[axis] += axisScores[answerIdx] || 0;
        });
      });

      const maxScore = Math.max(...Object.values(scores));
      const normalizedScores = {};
      Object.keys(scores).forEach(axis => {
        normalizedScores[axis] = Math.round((scores[axis] / maxScore) * 100);
      });

      const result = classifyPhilosophy(normalizedScores);
      renderResult({ ...result, ...normalizedScores });
    }

    function classifyPhilosophy(scores) {
      const { liberty, economic, social, change } = scores;
      
      if (liberty > 70) {
        if (economic > 60) {
          return {
            label: "Classical Liberal",
            description: "You believe in individual freedom and limited government, with emphasis on free markets and personal liberty as the foundation for human flourishing."
          };
        } else if (economic < 40) {
          return {
            label: "Libertarian Socialist",
            description: "You prioritize individual freedom alongside economic equality, seeking to minimize hierarchies in both government and markets."
          };
        } else {
          return {
            label: "Centrist Liberal",
            description: "You balance individual liberty with moderate government intervention, believing freedom works best within certain structural guardrails."
          };
        }
      } else if (liberty < 40) {
        if (social > 60 && change > 60) {
          return {
            label: "Progressive",
            description: "You believe in active government reform to address inequality and injustice, prioritizing collective wellbeing and social progress."
          };
        } else if (social < 40 && change < 40) {
          return {
            label: "Conservative",
            description: "You value tradition, stability, and gradual change, believing established institutions and moral values provide important guidance."
          };
        } else {
          return {
            label: "Communitarian",
            description: "You emphasize community and collective responsibility, seeking balance between individual needs and the common good."
          };
        }
      } else {
        if (change > 60) {
          return {
            label: "Social Democrat",
            description: "You support both individual rights and active government ensuring fairness and opportunity, with emphasis on democratic participation and reform."
          };
        } else {
          return {
            label: "Moderate",
            description: "You believe in pragmatic balance between competing values, seeking sensible middle-ground solutions that respect multiple perspectives."
          };
        }
      }
    }

    function renderResult(r) {
      const axisData = [
        { name: 'Liberty', left: 'Authoritarian', right: 'Libertarian', val: r.liberty, color: '#c4933c' },
        { name: 'Economy', left: 'Socialist', right: 'Capitalist', val: r.economic, color: '#8b7355' },
        { name: 'Social', left: 'Conservative', right: 'Progressive', val: r.social, color: '#a89070' },
        { name: 'Change', left: 'Status Quo', right: 'Reform', val: r.change, color: '#d4a85c' }
      ];
      document.getElementById('progress').style.width = '100%';
      document.getElementById('content').innerHTML = `
        <div class="result-box">
          <p class="result-label">Your Political Philosophy</p>
          <p class="result-title">${r.label}</p>
          <p class="result-desc">${r.description}</p>
          <div class="result-axes">
            ${axisData.map(a => `
              <div class="axis-card">
                <p class="axis-name">${a.name}</p>
                <div class="axis-bar"><div class="axis-fill" style="width:${a.val}%;background:${a.color}"></div></div>
                <div class="axis-labels"><span>${a.left}</span><span>${a.right}</span></div>
              </div>`).join('')}
          </div>
          <button class="btn btn-ghost restart-btn" onclick="restart()">Retake Quiz</button>
        </div>`;
    }

    function restart() { answers = []; current = 0; document.getElementById('progress').style.width = '0%'; render(); }

    render();
  </script>
</body>
</html>
