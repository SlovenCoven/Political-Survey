<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Political Philosophy Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --surface-0: #f5f5f3;
      --surface-1: #ededea;
      --surface-2: #ffffff;
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-muted: #9a9994;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.22);
      --border-accent: #185fa5;
      --fill-accent: #378add;
      --on-accent: #ffffff;
      --bg-accent: #e6f1fb;
      --text-danger: #a32d2d;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface-0: #1a1a18;
        --surface-1: #252523;
        --surface-2: #2e2e2b;
        --text-primary: #f0efe9;
        --text-secondary: #b4b2a9;
        --text-muted: #6b6a65;
        --border: rgba(255,255,255,0.1);
        --border-strong: rgba(255,255,255,0.18);
        --border-accent: #85b7eb;
        --fill-accent: #378add;
        --on-accent: #ffffff;
        --bg-accent: #042c53;
        --text-danger: #f09595;
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--surface-0);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    .quiz-wrap { width: 100%; max-width: 620px; }

    header { margin-bottom: 2.5rem; }
    header h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.4rem; }
    header p { font-size: 14px; color: var(--text-secondary); }

    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 2rem; }
    .progress-fill { height: 100%; background: var(--fill-accent); border-radius: 2px; transition: width 0.4s ease; }

    .question-num { font-size: 12px; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .question-text { font-size: 20px; font-weight: 500; line-height: 1.4; margin-bottom: 1.75rem; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      padding: 14px 18px;
      background: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s;
      font-family: var(--font-sans);
    }
    .option-btn:hover { border-color: var(--border-accent); background: var(--bg-accent); }
    .option-btn.selected { border-color: var(--border-accent); background: var(--bg-accent); }

    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; }
    .btn { padding: 10px 22px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); transition: opacity 0.15s; }
    .btn-primary { background: var(--fill-accent); color: var(--on-accent); border: none; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .btn-ghost { background: transparent; border: 0.5px solid var(--border-strong); color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--surface-1); }

    .result-box { padding: 2rem; background: var(--surface-1); border-radius: 12px; border: 0.5px solid var(--border); }
    .result-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; }
    .result-title { font-size: 28px; font-weight: 500; color: var(--fill-accent); margin-bottom: 1rem; }
    .result-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 1.5rem; }
    .result-axes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
    .axis-card { padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius); border: 0.5px solid var(--border); }
    .axis-name { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .axis-bar { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 6px; }
    .axis-fill { height: 100%; border-radius: 3px; }
    .axis-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); }

    .loading { text-align: center; padding: 3rem 1rem; }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--fill-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; color: var(--text-secondary); }
    .restart-btn { width: 100%; margin-top: 1rem; }

    @media (max-width: 480px) {
      .result-axes { grid-template-columns: 1fr; }
      .question-text { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="quiz-wrap">
    <header>
      <h1>Political philosophy quiz</h1>
      <p>20 questions to help identify your political worldview</p>
    </header>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div id="content"></div>
  </div>

  <script>
    const ANTHROPIC_API_KEY = 'your-api-key-here';

    const questions = [
      { q: "The government's primary role should be to...", options: ["Protect individual rights and freedoms with minimal interference", "Ensure equal opportunity and reduce systemic disadvantages", "Balance both individual liberty and collective welfare"] },
      { q: "When it comes to the economy, I believe...", options: ["Free markets naturally lead to the best outcomes for everyone", "Markets need strong regulation to prevent exploitation", "We should balance market freedom with social protections"] },
      { q: "On immigration, the priority should be...", options: ["Open borders — people should be free to move where they choose", "A controlled system that balances compassion with national interests", "Strict immigration policies to protect jobs and culture"] },
      { q: "Taxes should primarily be used to...", options: ["Be kept as low as possible so people keep their earnings", "Fund essential services like healthcare, education, and infrastructure", "Progressive rates that reduce wealth inequality"] },
      { q: "On social issues like marriage equality and drug policy, I think...", options: ["Individuals should have maximum personal freedom in lifestyle choices", "Society should protect marginalized communities while respecting choice", "Traditional values should guide policy on personal matters"] },
      { q: "Climate change policy should...", options: ["Be left to market innovation rather than government mandates", "Involve moderate regulations and international cooperation", "Be prioritized above economic concerns"] },
      { q: "Criminal justice should focus on...", options: ["Protecting individual rights from state overreach", "Rehabilitation and addressing root causes of crime", "Swift punishment as a deterrent to crime"] },
      { q: "Healthcare should be...", options: ["A free market good where competition drives down costs", "A right, provided through a public-private mixed system", "Controlled primarily by government"] },
      { q: "My view on political authority is...", options: ["The less government, the better — people can govern themselves", "Government is a necessary tool for creating a just society", "Strong central authority is needed for stability"] },
      { q: "When tradition and progress conflict, I think...", options: ["Both deserve equal scrutiny before acting", "Progress and reform should take priority over outdated norms", "Tradition contains wisdom that shouldn't be abandoned"] },
      { q: "Gun ownership should be...", options: ["An absolute right with minimal restrictions", "Allowed with reasonable background checks and regulations", "Tightly regulated to protect public safety"] },
      { q: "The best way to address poverty is...", options: ["Remove barriers to entrepreneurship and economic freedom", "Expand social safety nets and job training programs", "Encourage community and religious charity"] },
      { q: "On foreign policy, I believe the country should...", options: ["Stay out of other nations' affairs and focus on itself", "Engage diplomatically and through multilateral institutions", "Maintain military strength and strategic interests"] },
      { q: "Public education should...", options: ["Be opened to competition through school choice and vouchers", "Be well-funded and equitable across all communities", "Emphasize civic values, history, and traditional knowledge"] },
      { q: "When it comes to corporations and big business...", options: ["They drive innovation and should face minimal regulation", "They need oversight to prevent monopolies and protect workers", "They should be strictly controlled to serve public interest"] },
      { q: "Drug policy should...", options: ["Fully decriminalize or legalize all drugs as a personal freedom", "Decriminalize personal use while targeting trafficking", "Maintain strict laws to protect public health"] },
      { q: "The gap between rich and poor is...", options: ["A natural result of differing talent and effort", "A problem that requires government intervention to fix", "Concerning but best addressed through charity and community"] },
      { q: "Free speech should be...", options: ["Absolute — the government should never restrict speech", "Protected but with limits on harassment and incitement", "Balanced with responsibilities to prevent harm"] },
      { q: "On religion and government, I believe...", options: ["The state should be fully secular and religion kept private", "Faith can inform values but shouldn't dictate law", "Religious and traditional values should guide policy"] },
      { q: "The best description of my overall political outlook is...", options: ["I want maximum freedom for individuals from all authority", "I want a fair, reformed system that works for everyone", "I want a strong society built on tradition and order"] }
    ];

    let answers = [];
    let current = 0;

    function render() {
      if (current < questions.length) renderQuestion();
      else renderLoading();
    }

    function renderQuestion() {
      document.getElementById('progress').style.width = (current / questions.length * 100) + '%';
      const q = questions[current];
      document.getElementById('content').innerHTML = `
        <p class="question-num">Question ${current + 1} of ${questions.length}</p>
        <p class="question-text">${q.q}</p>
        <div class="options">
          ${q.options.map((o, i) => `<button class="option-btn${answers[current]===i?' selected':''}" onclick="select(${i})">${o}</button>`).join('')}
        </div>
        <div class="nav">
          ${current > 0 ? `<button class="btn btn-ghost" onclick="back()">← Back</button>` : `<span></span>`}
          <button class="btn btn-primary" onclick="next()" ${answers[current]==null?'disabled':''}>
            ${current === questions.length - 1 ? 'See results' : 'Next →'}
          </button>
        </div>`;
    }

    function select(i) { answers[current] = i; renderQuestion(); }
    function back() { current--; renderQuestion(); }
    function next() { if (answers[current] == null) return; current++; render(); }

    function renderLoading() {
      document.getElementById('progress').style.width = '100%';
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p class="loading-text">Analyzing your answers...</p>
        </div>`;
      analyzeAnswers();
    }

    async function analyzeAnswers() {
      const summary = questions.map((q, i) => `Q: ${q.q}\nA: ${q.options[answers[i]]}`).join('\n\n');
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': ANTHROPIC_API_KEY,
            'anthropic-version': '2023-06-01'
          },
          body: JSON.stringify({
            model: 'claude-opus-4-1',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: `Based on these 20 quiz answers, determine the person's political philosophy. Return ONLY valid JSON, no markdown, no backticks:\n\n${summary}\n\nReturn: {"label":"<2-4 word political philosophy>","description":"<2-3 sentence description>","liberty":<0-100>,"economic":<0-100>,"social":<0-100>,"change":<0-100>}`
            }]
          })
        });
        const data = await res.json();
        const text = data.content[0].text.replace(/```json|```/g,'').trim();
        renderResult(JSON.parse(text));
      } catch(e) {
        renderError();
      }
    }

    function renderResult(r) {
      const axisData = [
        { name: 'Liberty', left: 'Authoritarian', right: 'Libertarian', val: r.liberty, color: '#378ADD' },
        { name: 'Economy', left: 'Free market', right: 'Socialist', val: r.economic, color: '#1D9E75' },
        { name: 'Social', left: 'Conservative', right: 'Progressive', val: r.social, color: '#7F77DD' },
        { name: 'Change', left: 'Status quo', right: 'Radical reform', val: r.change, color: '#D85A30' }
      ];
      document.getElementById('progress').style.width = '100%';
      document.getElementById('content').innerHTML = `
        <div class="result-box">
          <p class="result-label">Your political philosophy</p>
          <p class="result-title">${r.label}</p>
          <p class="result-desc">${r.description}</p>
          <div class="result-axes">
            ${axisData.map(a => `
              <div class="axis-card">
                <p class="axis-name">${a.name}</p>
                <div class="axis-bar"><div class="axis-fill" style="width:${a.val}%;background:${a.color}"></div></div>
                <div class="axis-labels"><span>${a.left}</span><span>${a.right}</span></div>
              </div>`).join('')}
          </div>
          <button class="btn btn-ghost restart-btn" onclick="restart()">Retake quiz</button>
        </div>`;
    }

    function renderError() {
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <p class="loading-text" style="color:var(--text-danger)">Something went wrong. Check your API key and try again.</p>
          <button class="btn btn-ghost" style="margin-top:1rem" onclick="restart()">Restart</button>
        </div>`;
    }

    function restart() { answers = []; current = 0; document.getElementById('progress').style.width = '0%'; render(); }

    render();
  </script>
</body>
</html>
